<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emotion Waveform — Turn 3 — Emotional</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a12;
      color: #e8e8ee;
      font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .page {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 30px 0 44px;
    }
    h1 {
      color: #f0f0f0;
      font-size: clamp(23px, 2.7vw, 35px);
      line-height: 1.1;
      font-weight: 720;
      letter-spacing: 0;
    }
    .subtitle {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
      letter-spacing: 0.04em;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin: 18px 0 8px;
      color: #777;
      font-size: 12px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      display: inline-block;
      margin-right: 7px;
      vertical-align: -2px;
      border-radius: 2px;
    }
    .panel {
      border-top: 1px solid #24242e;
      padding: 15px 0 18px;
    }
    .header {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 7px;
    }
    .persona {
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
    }
    .metrics {
      color: #666;
      font-size: 12px;
      display: flex;
      gap: 18px;
      font-variant-numeric: tabular-nums;
    }
    .pos { color: #27AE60; }
    .neg { color: #C0392B; }
    canvas.waveform {
      width: 100%;
      height: 120px;
      display: block;
      background: #080810;
      border: 1px solid #181820;
      border-radius: 5px;
    }
    .axis {
      height: 52px;
      position: relative;
      margin-top: 5px;
      color: #555;
      font-size: 8px;
      display: none;
    }
    .panel.last .axis { display: block; }
    .tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 8px;
      background: #444;
    }
    .tick span {
      position: absolute;
      top: 11px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .region {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .loading {
      margin-top: 30px;
      padding: 34px;
      color: #888;
      background: #101018;
      border: 1px solid #24242e;
      border-radius: 8px;
    }
    @media (max-width: 760px) {
      .header { grid-template-columns: 1fr; gap: 6px; }
      .metrics { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Emotion Waveform — Turn 3 — Emotional</h1>
    <div class="subtitle">Signed activation across 171 emotion directions · v3 clean separation · Qwen 3 32B layer 48</div>
    <div class="legend">
      <span><span class="swatch" style="background:#E8923A"></span>Interviewer</span>
      <span><span class="swatch" style="background:#4A90D9"></span>Standard Model</span>
      <span>Bars above zero = emotion present · Below zero = suppressed</span>
    </div>
    <div id="root" class="loading">Loading waveform data...</div>
  </main>

  <script>
    const CONDITION = "emotional";
    const DATA_PATH = "data/waveform_data_turn3.json";
    const PERSONAS = ["trickster","ancient","contrarian","blogger","podcaster","synthesizer","editor"];
    const Y_LIMIT = 0.25;

    function clip(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function xFor(valence, width) {
      return ((valence + 1) / 2) * width;
    }

    function drawWaveform(canvas, interviewer, standard) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = rect.width;
      const H = rect.height;
      const zero = H / 2;
      const grid = [-0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75];

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#080810";
      ctx.fillRect(0, 0, W, H);

      grid.forEach((tick) => {
        const x = xFor(tick, W);
        ctx.strokeStyle = tick === 0 ? "#333" : "#1f1f28";
        ctx.lineWidth = tick === 0 ? 1.2 : 0.7;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      });

      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, zero);
      ctx.lineTo(W, zero);
      ctx.stroke();

      function drawBars(points, color, capColor) {
        const sorted = [...points].sort((a, b) => Math.abs(a.activation) - Math.abs(b.activation));
        const barW = 5.5;
        sorted.forEach((point) => {
          const activation = clip(point.activation, -Y_LIMIT, Y_LIMIT);
          const x = xFor(point.valence, W);
          const h = clip(activation * H * 0.45 / Y_LIMIT, -H * 0.45, H * 0.45);
          const y = h >= 0 ? zero - h : zero;
          ctx.fillStyle = color;
          ctx.fillRect(x - barW / 2, y, barW, Math.abs(h));
          ctx.fillStyle = capColor;
          if (h >= 0) ctx.fillRect(x - barW / 2, y - 1, barW, 2);
          else ctx.fillRect(x - barW / 2, y + Math.abs(h) - 1, barW, 2);
        });
      }

      drawBars(interviewer, "rgba(232,146,58,0.70)", "#E8923A");
      drawBars(standard, "rgba(74,144,217,0.70)", "#4A90D9");

      ctx.fillStyle = "#555";
      ctx.font = "9px Space Mono, monospace";
      ctx.textAlign = "left";
      ctx.fillText("+0.25", 6, 10);
      ctx.fillText("0", 6, zero - 3);
      ctx.fillText("-0.25", 6, H - 5);
    }

    function axisHtml() {
      const ticks = [-1,-0.75,-0.5,-0.25,0,0.25,0.5,0.75,1];
      const regions = [
        ["threat", -0.88], ["anger", -0.75], ["sadness", -0.70],
        ["uncertain", -0.25], ["calm", 0.42], ["joy", 0.88], ["love", 0.92]
      ];
      return ticks.map((tick) => {
        const left = ((tick + 1) / 2) * 100;
        const label = tick > 0 ? `+${tick}` : `${tick}`;
        return `<div class="tick" style="left:${left}%"><span>${label}</span></div>`;
      }).join("") + regions.map(([label, valence]) => {
        const left = ((valence + 1) / 2) * 100;
        return `<div class="region" style="left:${left}%">${label}</div>`;
      }).join("");
    }

    function render(data) {
      const root = document.getElementById("root");
      root.className = "";
      root.innerHTML = "";
      PERSONAS.forEach((persona) => {
        const item = data.data[persona]?.[CONDITION];
        if (!item) return;
        const axis = item.standard_axis ?? 0;
        const panel = document.createElement("section");
        panel.className = `panel ${persona === "editor" ? "last" : ""}`;
        panel.innerHTML = `
          <div class="header">
            <div class="persona">${persona}</div>
            <div class="metrics">
              <span>S-axis <strong class="${axis < 0 ? "neg" : "pos"}">${axis.toFixed(4)}</strong></span>
              <span>I-cos <strong>${(item.interviewer_cosine ?? 0).toFixed(3)}</strong></span>
            </div>
          </div>
          <canvas class="waveform"></canvas>
          <div class="axis">${axisHtml()}</div>
        `;
        root.appendChild(panel);
        drawWaveform(panel.querySelector("canvas"), item.interviewer, item.standard);
      });
    }

    fetch(DATA_PATH, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        document.getElementById("root").textContent = `Failed to load ${DATA_PATH}: ${error.message}`;
      });

    window.addEventListener("resize", () => {
      fetch(DATA_PATH, { cache: "no-store" }).then((response) => response.json()).then(render);
    });
  </script>
</body>
</html>
