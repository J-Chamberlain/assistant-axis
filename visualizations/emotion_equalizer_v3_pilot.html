<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emotion Equalizer — v3 Trickster Pilot</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #060608;
      --panel: #101218;
      --panel-2: #151923;
      --line: #252b36;
      --text: #eef2f7;
      --muted: #aab3c2;
      --soft: #737d91;
      --amber: #E8923A;
      --blue: #4A90D9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(42, 30, 70, 0.42), transparent 34%),
        radial-gradient(circle at 14% 15%, rgba(232, 146, 58, 0.08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button, input { font: inherit; }

    .app {
      width: min(1260px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 6px;
      color: var(--amber);
      font-size: clamp(18px, 2.4vw, 30px);
      line-height: 1.05;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      color: #7d8492;
      font-size: 12px;
      line-height: 1.45;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 11px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .pill.amber { color: #ffc27c; border-color: rgba(232, 146, 58, 0.35); }
    .pill.blue { color: #9fccff; border-color: rgba(74, 144, 217, 0.38); }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, auto) 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(16,18,24,0.88);
      border-radius: 8px;
    }

    .control {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0b0e13;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .control:hover { border-color: rgba(232, 146, 58, 0.55); }

    .slider-wrap {
      display: grid;
      grid-template-columns: 1fr 68px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--amber);
    }

    .turn-readout {
      color: var(--muted);
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .equalizer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: rgba(16,18,24,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,0.28);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.025);
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .panel-title.interviewer { color: var(--amber); }
    .panel-title.standard { color: var(--blue); }

    .panel-body { padding: 15px; }

    .meters {
      display: grid;
      gap: 10px;
    }

    .meter {
      display: grid;
      grid-template-columns: 106px 1fr 58px;
      gap: 12px;
      align-items: center;
    }

    .meter-name {
      color: var(--muted);
      font-size: 12px;
    }

    .bar {
      position: relative;
      height: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #080b10;
      border-radius: 4px;
      overflow: hidden;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      transition: width 420ms ease, opacity 420ms ease;
      box-shadow: 0 0 14px currentColor;
    }

    .meter-value {
      color: var(--soft);
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .trajectory {
      margin-bottom: 14px;
    }

    .traj-label {
      color: #555d6c;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .traj-canvas {
      width: 100%;
      height: 76px;
      display: block;
      background: #080a0f;
      border-top: 1px solid var(--line);
    }

    .dialogue {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .speaker {
      min-height: 158px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .speaker h3 {
      margin: 0 0 9px;
      color: var(--amber);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .speaker.standard h3 { color: var(--blue); }

    .utterance {
      margin: 0;
      color: #d7dde8;
      font-size: 13px;
      line-height: 1.55;
    }

    .loading, .error {
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .topbar, .equalizer, .dialogue, .controls {
        grid-template-columns: 1fr;
      }
      .status { justify-content: flex-start; }
      .meter { grid-template-columns: 88px 1fr 48px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const DATA_PATH = "data/v3_trickster_adversarial.json";
    const PLAY_INTERVAL_MS = 1500;
    const BAR_MAX = 0.14;

    const FAMILIES = [
      { key: "fear", label: "Fear", color: "#7B2D8B", members: ["terrified","afraid","panicked","horrified","dread","anxious","apprehensive"] },
      { key: "anger", label: "Anger", color: "#C0392B", members: ["outraged","furious","hostile","angry","irritated","frustrated","indignant"] },
      { key: "sadness", label: "Sadness", color: "#2980B9", members: ["grief","hopeless","depressed","sorrowful","sad","melancholic","lonely"] },
      { key: "disgust", label: "Disgust", color: "#8E6B3E", members: ["disgusted","contempt","cynical","bitter","resentful","spiteful"] },
      { key: "uncertain", label: "Uncertain", color: "#7F8C8D", members: ["confused","uncertain","doubtful","skeptical","suspicious","puzzled"] },
      { key: "calm", label: "Calm", color: "#27AE60", members: ["calm","serene","peaceful","content","patient","tranquil","stoic"] },
      { key: "curiosity", label: "Curiosity", color: "#D4A017", members: ["curious","interested","fascinated","absorbed","thoughtful","reflective"] },
      { key: "joy", label: "Joy", color: "#E67E22", members: ["joyful","excited","elated","happy","delighted","enthusiastic","thrilled"] },
      { key: "love", label: "Love", color: "#E84393", members: ["loving","grateful","compassionate","tender","trusting","sympathetic"] }
    ];

    function truncate(text, limit = 220) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      return clean.length > limit ? `${clean.slice(0, limit).trim()}…` : clean;
    }

    function emotionMap(list) {
      return Object.fromEntries((list || []).map((item) => [String(item.name).toLowerCase(), Number(item.activation) || 0]));
    }

    function familyMeans(list) {
      const map = emotionMap(list);
      return Object.fromEntries(FAMILIES.map((family) => {
        const total = family.members.reduce((sum, name) => sum + (map[name] || 0), 0);
        return [family.key, total / family.members.length];
      }));
    }

    function findPlateau(turns) {
      for (let i = 2; i < turns.length - 1; i += 1) {
        if (Math.abs(turns[i].standard_axis - turns[i + 1].standard_axis) < 0.0001) return i;
      }
      return null;
    }

    function Meter({ family, value }) {
      const width = Math.min(100, Math.max(0, (value / BAR_MAX) * 100));
      return (
        <div className="meter">
          <div className="meter-name">{family.label}</div>
          <div className="bar">
            <div
              className="fill"
              style={{
                width: `${width}%`,
                background: family.color,
                color: family.color,
                opacity: 0.35 + Math.min(0.65, width / 110)
              }}
            />
          </div>
          <div className="meter-value">{value.toFixed(3)}</div>
        </div>
      );
    }

    function Trajectory({ turns, turnIndex }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !turns.length) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const W = rect.width;
        const H = rect.height;
        const padX = 18;
        const xFor = (index) => padX + (index / Math.max(1, turns.length - 1)) * (W - padX * 2);
        const yAxis = (value) => H * 0.54 - (value / 0.32) * (H * 0.34);
        const yCos = (value) => H - ((value - 0.38) / 0.42) * (H * 0.76) - 8;
        const plateau = findPlateau(turns);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#080a0f";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "#1f2632";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padX, H * 0.54);
        ctx.lineTo(W - padX, H * 0.54);
        ctx.stroke();

        function drawLine(accessor, yFor, color, dashed = false) {
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.setLineDash(dashed ? [4, 4] : []);
          ctx.beginPath();
          turns.forEach((turn, index) => {
            const x = xFor(index);
            const y = yFor(accessor(turn));
            index === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          });
          ctx.stroke();
          ctx.setLineDash([]);
        }

        drawLine((turn) => turn.standard_axis, yAxis, "#4A90D9");
        drawLine((turn) => turn.interviewer_cosine, yCos, "#E8923A", true);

        if (plateau !== null) {
          const px = xFor(plateau);
          ctx.strokeStyle = "#ffffff2a";
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 5]);
          ctx.beginPath();
          ctx.moveTo(px, 0);
          ctx.lineTo(px, H);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#777";
          ctx.font = "8px Space Mono, monospace";
          ctx.fillText("plateau", px + 4, 10);
        }

        const cx = xFor(turnIndex);
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, 0);
        ctx.lineTo(cx, H);
        ctx.stroke();

        const current = turns[turnIndex];
        ctx.fillStyle = "#4A90D9";
        ctx.beginPath();
        ctx.arc(cx, yAxis(current.standard_axis), 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#E8923A";
        ctx.beginPath();
        ctx.arc(cx, yCos(current.interviewer_cosine), 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "10px Space Mono, monospace";
        ctx.fillStyle = "#4A90D9";
        ctx.fillText(`standard axis ${current.standard_axis.toFixed(4)}`, 12, H - 11);
        ctx.fillStyle = "#E8923A";
        ctx.fillText(`interviewer cosine ${current.interviewer_cosine.toFixed(3)}`, 190, H - 11);
      }, [turns, turnIndex]);

      return <canvas className="traj-canvas" ref={canvasRef} />;
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [turnIndex, setTurnIndex] = useState(0);
      const [playing, setPlaying] = useState(false);

      useEffect(() => {
        fetch(DATA_PATH, { cache: "no-store" })
          .then((response) => {
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            return response.json();
          })
          .then(setData)
          .catch((err) => setError(err.message));
      }, []);

      useEffect(() => {
        if (!playing || !data?.turns?.length) return undefined;
        const id = setInterval(() => {
          setTurnIndex((current) => current >= data.turns.length - 1 ? 0 : current + 1);
        }, PLAY_INTERVAL_MS);
        return () => clearInterval(id);
      }, [playing, data]);

      if (error) return <main className="app"><div className="error">Failed to load {DATA_PATH}: {error}</div></main>;
      if (!data) return <main className="app"><div className="loading">Loading v3 pilot data…</div></main>;

      const turns = data.turns || [];
      const current = turns[turnIndex];
      const interviewer = familyMeans(current.int_emotions_top);
      const standard = familyMeans(current.std_emotions_top);
      const maxFamily = (values) => FAMILIES
        .map((family) => ({ family, value: values[family.key] || 0 }))
        .sort((a, b) => b.value - a.value)[0];
      const topInterviewer = maxFamily(interviewer);
      const topStandard = maxFamily(standard);

      return (
        <main className="app">
          <header className="topbar">
            <div>
              <h1>Emotion Activation Monitor</h1>
              <div className="subtitle">
                v3 trickster/adversarial pilot · real per-turn Qwen 3 32B layer-48 probe readouts · scrubber advances by turn
              </div>
            </div>
            <div className="status">
              <span className="pill amber">Turn {turnIndex + 1}/{turns.length}</span>
              <span className="pill blue">S-axis {current.standard_axis.toFixed(4)}</span>
              <span className="pill amber">I-cos {current.interviewer_cosine.toFixed(3)}</span>
            </div>
          </header>

          <section className="controls">
            <button className="control" onClick={() => { setTurnIndex(0); setPlaying(false); }}>RESET</button>
            <button className="control" onClick={() => setPlaying((value) => !value)}>{playing ? "PAUSE" : "PLAY"}</button>
            <button className="control" onClick={() => setTurnIndex((value) => Math.min(turns.length - 1, value + 1))}>STEP</button>
            <div className="slider-wrap">
              <input
                type="range"
                min="0"
                max={turns.length - 1}
                value={turnIndex}
                onChange={(event) => { setPlaying(false); setTurnIndex(Number(event.target.value)); }}
              />
              <div className="turn-readout">T{turnIndex + 1}</div>
            </div>
          </section>

          <section className="equalizer">
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title interviewer">Interviewer · Trickster</div>
                <span className="pill amber">top family: {topInterviewer.family.label} {topInterviewer.value.toFixed(3)}</span>
              </div>
              <div className="panel-body">
                <div className="meters">
                  {FAMILIES.map((family) => <Meter key={family.key} family={family} value={interviewer[family.key] || 0} />)}
                </div>
              </div>
            </div>

            <div className="panel">
              <div className="panel-head">
                <div className="panel-title standard">Standard Model</div>
                <span className="pill blue">top family: {topStandard.family.label} {topStandard.value.toFixed(3)}</span>
              </div>
              <div className="panel-body">
                <div className="meters">
                  {FAMILIES.map((family) => <Meter key={family.key} family={family} value={standard[family.key] || 0} />)}
                </div>
              </div>
            </div>
          </section>

          <section className="panel trajectory">
            <div className="panel-head">
              <div className="panel-title">Axis trajectory</div>
              <span className="pill">standard axis solid blue · interviewer cosine dashed amber</span>
            </div>
            <Trajectory turns={turns} turnIndex={turnIndex} />
          </section>

          <section className="dialogue">
            <div className="speaker">
              <h3>Trickster</h3>
              <p className="utterance">{truncate(current.interviewer_text)}</p>
            </div>
            <div className="speaker standard">
              <h3>Standard Model</h3>
              <p className="utterance">{truncate(current.standard_text)}</p>
            </div>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
